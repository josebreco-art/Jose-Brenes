    <script>
      // Desregistrar service workers heredados para evitar pantallas en blanco o cachés obsoletas en preview
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        }).catch(function() {});
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) {
              caches.delete(name);
            }
          }).catch(function() {});
        }
      }
    </script>
