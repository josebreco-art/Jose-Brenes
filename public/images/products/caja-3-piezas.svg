<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="fry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="chick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="sh2">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#450a0a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg2)"/>
  <ellipse cx="200" cy="245" rx="130" ry="20" fill="#450a0a" opacity="0.12"/>
  <!-- Box Base -->
  <g filter="url(#sh2)">
    <polygon points="90,160 310,160 280,240 120,240" fill="url(#box)"/>
    <polygon points="90,160 120,240 105,240 75,160" fill="#7f1d1d"/>
    <!-- Logo on box -->
    <rect x="160" y="180" width="80" height="35" rx="6" fill="#fef08a"/>
    <text x="200" y="202" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#991b1b" text-anchor="middle">SABOR</text>
    <text x="200" y="212" font-family="system-ui, sans-serif" font-weight="700" font-size="8" fill="#d97706" text-anchor="middle">CERVANTEÑO</text>
  </g>
  <!-- Fries inside box -->
  <g transform="translate(100, 75)">
    <rect x="20" y="20" width="10" height="70" rx="3" fill="url(#fry)" transform="rotate(-15 25 55)"/>
    <rect x="35" y="10" width="10" height="80" rx="3" fill="url(#fry)" transform="rotate(-5 40 50)"/>
    <rect x="50" y="15" width="10" height="75" rx="3" fill="url(#fry)" transform="rotate(8 55 50)"/>
    <rect x="65" y="25" width="10" height="65" rx="3" fill="url(#fry)" transform="rotate(20 70 55)"/>
  </g>
  <!-- 3 Pieces of Chicken -->
  <!-- Piece 1 -->
  <ellipse cx="160" cy="130" rx="40" ry="30" fill="url(#chick)" transform="rotate(-15 160 130)"/>
  <circle cx="145" cy="120" r="4" fill="#fef08a" opacity="0.8"/>
  <circle cx="170" cy="135" r="5" fill="#fde047" opacity="0.6"/>
  <!-- Piece 2 -->
  <ellipse cx="240" cy="125" rx="45" ry="32" fill="url(#chick)" transform="rotate(20 240 125)"/>
  <circle cx="230" cy="115" r="5" fill="#fef08a" opacity="0.8"/>
  <circle cx="255" cy="135" r="4" fill="#fde047" opacity="0.6"/>
  <!-- Piece 3 Top Front -->
  <g filter="url(#sh2)">
    <ellipse cx="200" cy="150" rx="48" ry="34" fill="url(#chick)"/>
    <circle cx="180" cy="140" r="5" fill="#fef08a" opacity="0.9"/>
    <circle cx="215" cy="155" r="5" fill="#fde047" opacity="0.8"/>
    <circle cx="195" cy="165" r="4" fill="#fef08a" opacity="0.6"/>
    <!-- Small Bone Tip -->
    <path d="M245 155 L265 162 C270 160 275 164 274 168 C273 172 268 174 263 170 L242 165 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  </g>
</svg>
