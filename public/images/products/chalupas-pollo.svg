<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="chalupa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shch">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#78350f" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgch)"/>
  <ellipse cx="200" cy="255" rx="140" ry="20" fill="#78350f" opacity="0.14"/>

  <g filter="url(#shch)">
    <!-- 3 Chalupas Shells Platter -->
    <!-- Left Shell -->
    <ellipse cx="110" cy="180" rx="55" ry="30" fill="url(#chalupa)"/>
    <ellipse cx="110" cy="175" rx="48" ry="24" fill="#78350f"/>
    <!-- Center Shell -->
    <ellipse cx="200" cy="200" rx="65" ry="35" fill="url(#chalupa)"/>
    <ellipse cx="200" cy="195" rx="56" ry="28" fill="#78350f"/>
    <!-- Right Shell -->
    <ellipse cx="290" cy="180" rx="55" ry="30" fill="url(#chalupa)"/>
    <ellipse cx="290" cy="175" rx="48" ry="24" fill="#78350f"/>

    <!-- Shredded Chicken & Beans Topping -->
    <ellipse cx="200" cy="190" rx="45" ry="20" fill="#d97706"/>
    <!-- Lettuce and Cabbage -->
    <path d="M160 180 Q180 160 200 175 Q220 160 240 180 Z" fill="#22c55e"/>
    <path d="M75 165 Q95 150 115 162 Q130 150 145 165 Z" fill="#22c55e"/>
    <path d="M255 165 Q275 150 295 162 Q310 150 325 165 Z" fill="#22c55e"/>

    <!-- Pico de Gallo (Diced Tomatoes & Cilantro) -->
    <rect x="180" y="172" width="7" height="7" rx="1" fill="#ef4444"/>
    <rect x="205" y="170" width="8" height="8" rx="1" fill="#ef4444"/>
    <rect x="195" y="180" width="7" height="7" rx="1" fill="#ef4444"/>
    <rect x="95" y="158" width="6" height="6" rx="1" fill="#ef4444"/>
    <rect x="120" y="160" width="6" height="6" rx="1" fill="#ef4444"/>
    <rect x="275" y="158" width="6" height="6" rx="1" fill="#ef4444"/>
    <rect x="300" y="160" width="6" height="6" rx="1" fill="#ef4444"/>

    <!-- Grated Hard Cheese (Queso Bagaces Espolvoreado) -->
    <circle cx="185" cy="178" r="2.5" fill="#ffffff"/>
    <circle cx="215" cy="175" r="2.5" fill="#ffffff"/>
    <circle cx="200" cy="185" r="2.5" fill="#ffffff"/>
    <circle cx="105" cy="162" r="2.5" fill="#ffffff"/>
    <circle cx="285" cy="162" r="2.5" fill="#ffffff"/>

    <!-- Cream / Natilla Drizzle -->
    <path d="M165 178 Q200 160 235 180" stroke="#fefce8" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
