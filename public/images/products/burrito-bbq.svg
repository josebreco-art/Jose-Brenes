<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgbr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="flour" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="shbr">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7c2d12" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgbr)"/>
  <ellipse cx="200" cy="255" rx="130" ry="18" fill="#7c2d12" opacity="0.14"/>

  <!-- Burrito Cut in Half diagonally showing juicy stuffing -->
  <g filter="url(#shbr)">
    <!-- Main Wrapped Body -->
    <path d="M100 130 C90 100 130 90 270 120 C310 130 330 180 290 220 C180 240 100 200 100 130 Z" fill="url(#flour)"/>
    
    <!-- Grill Marks on Flour Tortilla -->
    <line x1="140" y1="110" x2="170" y2="210" stroke="#b45309" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="180" y1="120" x2="210" y2="220" stroke="#b45309" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="220" y1="130" x2="250" y2="225" stroke="#b45309" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <!-- Cut Cross Section Revealing Filling -->
    <g transform="translate(40, -10)">
      <ellipse cx="90" cy="150" rx="35" ry="50" fill="#7f1d1d" transform="rotate(-15 90 150)"/>
      <ellipse cx="90" cy="150" rx="30" ry="44" fill="#b45309" transform="rotate(-15 90 150)"/>
      <!-- Rice & Cheese inside -->
      <circle cx="85" cy="140" r="10" fill="#facc15"/>
      <circle cx="95" cy="160" r="12" fill="#ef4444"/>
      <circle cx="80" cy="165" r="8" fill="#15803d"/>
      <circle cx="90" cy="130" r="6" fill="#ffffff"/>
      <!-- BBQ Sauce Drip -->
      <path d="M95 180 Q105 200 95 210" stroke="#450a0a" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Aluminum Foil Wrap at bottom -->
    <path d="M250 145 C280 155 310 175 290 220 C230 235 200 230 190 215 C200 180 230 150 250 145 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M210 200 L235 185 L260 210" stroke="#64748b" stroke-width="2" fill="none"/>
  </g>
</svg>
