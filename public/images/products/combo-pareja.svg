<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="chkp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="fryp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgcp)"/>
  <ellipse cx="200" cy="250" rx="150" ry="22" fill="#881337" opacity="0.12"/>
  
  <!-- Left Soda Cup -->
  <g transform="translate(60, 80)">
    <polygon points="10,40 50,40 42,140 18,140" fill="url(#cup)"/>
    <ellipse cx="30" cy="40" rx="20" ry="5" fill="#f43f5e"/>
    <!-- Straw -->
    <path d="M30 40 L35 10 L50 0" stroke="#fecdd3" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Right Soda Cup -->
  <g transform="translate(290, 80)">
    <polygon points="10,40 50,40 42,140 18,140" fill="url(#cup)"/>
    <ellipse cx="30" cy="40" rx="20" ry="5" fill="#f43f5e"/>
    <!-- Straw -->
    <path d="M30 40 L25 10 L10 0" stroke="#fecdd3" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Fries Bag in Center-Back -->
  <g transform="translate(160, 90)">
    <rect x="15" y="10" width="8" height="60" rx="3" fill="url(#fryp)" transform="rotate(-15 15 40)"/>
    <rect x="28" y="0" width="8" height="70" rx="3" fill="url(#fryp)" transform="rotate(-5 28 35)"/>
    <rect x="40" y="5" width="8" height="65" rx="3" fill="url(#fryp)" transform="rotate(8 40 37)"/>
    <rect x="52" y="15" width="8" height="55" rx="3" fill="url(#fryp)" transform="rotate(20 52 42)"/>
    <polygon points="10,60 70,60 62,130 18,130" fill="#dc2626"/>
    <circle cx="40" cy="95" r="14" fill="#fef08a"/>
    <text x="40" y="99" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#dc2626" text-anchor="middle">M</text>
  </g>

  <!-- 6 Chicken Pieces (Foreground) -->
  <g transform="translate(0, 10)">
    <ellipse cx="150" cy="190" rx="36" ry="25" fill="url(#chkp)" transform="rotate(-20 150 190)"/>
    <ellipse cx="250" cy="190" rx="36" ry="25" fill="url(#chkp)" transform="rotate(20 250 190)"/>
    <ellipse cx="200" cy="205" rx="42" ry="28" fill="url(#chkp)"/>
    <!-- Crispy details -->
    <circle cx="185" cy="195" r="4" fill="#fef08a" opacity="0.9"/>
    <circle cx="215" cy="210" r="5" fill="#fde047" opacity="0.8"/>
    <!-- Biscuits / Dinner Rolls -->
    <ellipse cx="110" cy="225" rx="22" ry="15" fill="#d97706"/>
    <ellipse cx="110" cy="220" rx="18" ry="11" fill="#fde68a"/>
    <ellipse cx="290" cy="225" rx="22" ry="15" fill="#d97706"/>
    <ellipse cx="290" cy="220" rx="18" ry="11" fill="#fde68a"/>
  </g>
</svg>
