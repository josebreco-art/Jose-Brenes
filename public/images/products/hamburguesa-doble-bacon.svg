<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgdb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="bun2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bacon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shdb">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#451a03" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgdb)"/>
  <ellipse cx="200" cy="265" rx="125" ry="18" fill="#451a03" opacity="0.18"/>

  <g filter="url(#shdb)">
    <!-- Bottom Bun -->
    <path d="M120 235 C120 255 280 255 280 235 L275 220 L125 220 Z" fill="url(#bun2)"/>

    <!-- Patty 1 -->
    <path d="M115 195 Q200 190 285 195 Q280 220 200 222 Q120 220 115 195 Z" fill="#b45309"/>
    <!-- Cheese 1 -->
    <polygon points="120,195 280,195 250,215 220,198 170,215 140,195" fill="#facc15"/>

    <!-- Bacon Strips -->
    <path d="M100 185 Q150 170 200 185 Q250 170 300 185" stroke="url(#bacon)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M110 175 Q160 190 210 175 Q260 190 290 175" stroke="url(#bacon)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Patty 2 -->
    <path d="M115 150 Q200 145 285 150 Q280 175 200 177 Q120 175 115 150 Z" fill="#d97706"/>
    <!-- Cheese 2 -->
    <polygon points="120,150 280,150 260,170 200,165 150,170 120,150" fill="#facc15"/>

    <!-- Lettuce & Pickle -->
    <path d="M110 135 Q150 125 200 138 Q250 125 290 135 L285 150 L115 150 Z" fill="#22c55e"/>

    <!-- Top Bun -->
    <path d="M115 135 C115 65 285 65 285 135 Z" fill="url(#bun2)"/>
    
    <!-- Sesame -->
    <ellipse cx="170" cy="85" rx="3" ry="5" fill="#fef08a" transform="rotate(15 170 85)"/>
    <ellipse cx="215" cy="80" rx="3" ry="5" fill="#fef08a" transform="rotate(-15 215 80)"/>
    <ellipse cx="150" cy="110" rx="3" ry="5" fill="#fef08a" transform="rotate(-25 150 110)"/>
    <ellipse cx="245" cy="105" rx="3" ry="5" fill="#fef08a" transform="rotate(25 245 105)"/>
    <ellipse cx="200" cy="105" rx="3" ry="5" fill="#fef08a"/>
  </g>
</svg>
