<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#291102"/>
    </linearGradient>
    <linearGradient id="label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shg">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#14532d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgg)"/>
  <ellipse cx="200" cy="265" rx="90" ry="16" fill="#14532d" opacity="0.15"/>

  <!-- Cold Refreshing Bottled Soda with Condensation Droplets -->
  <g filter="url(#shg)">
    <!-- Bottle Silhouette -->
    <!-- Cap -->
    <rect x="185" y="30" width="30" height="15" rx="3" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <line x1="190" y1="30" x2="190" y2="45" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="200" y1="30" x2="200" y2="45" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="210" y1="30" x2="210" y2="45" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Neck -->
    <path d="M188 45 L188 85 C188 120 160 135 160 160 L160 240 C160 255 240 255 240 240 L240 160 C240 135 212 120 212 85 L212 45 Z" fill="url(#bottle)"/>

    <!-- Glass Reflection Highlight -->
    <path d="M170 160 L170 240" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M192 60 L192 100" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Red Soda Label -->
    <rect x="160" y="165" width="80" height="55" fill="url(#label)"/>
    <ellipse cx="200" cy="192" rx="32" ry="20" fill="#fef08a"/>
    <text x="200" y="196" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#dc2626" text-anchor="middle">COLA</text>
    <text x="200" y="206" font-family="system-ui, sans-serif" font-weight="800" font-size="7" fill="#78350f" text-anchor="middle">600 ML</text>

    <!-- Cold Droplets -->
    <ellipse cx="178" cy="130" rx="2" ry="4" fill="#bae6fd" opacity="0.8"/>
    <ellipse cx="225" cy="140" rx="2" ry="3" fill="#bae6fd" opacity="0.8"/>
    <ellipse cx="175" cy="230" rx="2" ry="3" fill="#bae6fd" opacity="0.8"/>
    <ellipse cx="228" cy="225" rx="2" ry="4" fill="#bae6fd" opacity="0.8"/>
  </g>

  <!-- Ice Cubes Around Base -->
  <g transform="translate(100, 220)">
    <rect x="20" y="15" width="22" height="22" rx="4" fill="#bae6fd" stroke="#7dd3fc" stroke-width="2" transform="rotate(-15 30 25)" opacity="0.9"/>
    <rect x="160" y="20" width="20" height="20" rx="4" fill="#bae6fd" stroke="#7dd3fc" stroke-width="2" transform="rotate(20 170 30)" opacity="0.9"/>
  </g>
</svg>
